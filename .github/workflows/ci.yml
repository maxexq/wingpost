name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wingpost
          POSTGRES_PASSWORD: wingpost
          POSTGRES_DB: wingpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingpost"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      WINGPOST_TEST_DATABASE_URL: postgres://wingpost:wingpost@localhost:5432/wingpost?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
