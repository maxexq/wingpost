x-wingpost: &wingpost
  build: .
  environment:
    DATABASE_URL: postgres://wingpost:wingpost@postgres:5432/wingpost?sslmode=disable

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wingpost
      POSTGRES_PASSWORD: wingpost
      POSTGRES_DB: wingpost
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingpost"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    <<: *wingpost
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *wingpost
    command: ["api"]
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *wingpost
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
